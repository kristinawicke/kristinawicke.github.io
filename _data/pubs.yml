    author = {Allman, Elizabeth S. and Baños, Hector and Rhodes, John A. and Wicke, Kristina},
    year = {2025}
    }


- title: "Metaconcepts of rooted tree balance"
  authors: "Mareike Fischer, Tom N. Hamann, Kristina Wicke"
  alphabetical: true
  year: 2025
  month: 09
  date: 2025-09-01
  type: article
  journal: "Bulletin of Mathematical Biology"
  volume: 87
  issue: 9
  pages: "56 pages"
  journal_url: "https://doi.org/10.1007/s11538-025-01509-y"
  arxiv: "2506.08614"
  abstract: >-
    Measures of tree balance play an important role in many different research areas such as
    mathematical phylogenetics or theoretical computer science. Typically, tree balance is
    quantified by a single number which is assigned to the tree by a balance or imbalance
    index, of which several exist in the literature. Most of these indices are based on structural
    aspects of tree shape, such as clade sizes or leaf depths. For instance, indices like the
    Sackin index, total cophenetic index, and -shape statistic all quantify tree balance
    through clade sizes, albeit with different definitions and properties. In this paper, we
    formalize the idea that many tree (im)balance indices are functions of similar underlying
    tree shape characteristics by introducing metaconcepts of tree balance. A metaconcept is a
    function that depends on a function f capturing some aspect of tree shape, such as
    balance values, clade sizes, or leaf depths. These metaconcepts encompass existing indices
    but also provide new means of measuring tree balance. The versatility and generality of
    metaconcepts allow for the systematic study of entire families of (im)balance indices,
    providing deeper insights that extend beyond index-by-index analysis.
  bib: |
    @article{Fischer2025,
    title = {Metaconcepts of Rooted Tree Balance},
    volume = {87},
    DOI = {10.1007/s11538-025-01509-y},
    number = {9},
    journal = {Bulletin of Mathematical Biology},
    publisher = {Springer Science and Business Media LLC},
    author = {Fischer,  Mareike and Hamann,  Tom Niklas and Wicke,  Kristina},
    year = {2025}
    }


- title: "Tree balance in phylogenetic models"
  authors: "Sophie J. Kersting, Kristina Wicke, Mareike Fischer"
  year: 2025
  month: 02
  date: 2025-02-13
  type: article
  journal: "Philosophical Transactions of the Royal Society B: Biological Sciences"
  volume: 380
  issue: 1919
  pages: "15 pages"
  journal_url: "https://doi.org/10.1098/rstb.2023.0303"
  arxiv: "2406.05185"
  abstract: >-
    Tree shape statistics, particularly measures of tree (im)balance, play an important role in the analysis of
    the shape of phylogenetic trees. With applications ranging from testing evolutionary models
    to studying the impact of fertility inheritance and selection, or tumour development and language
    evolution, the assessment of measures of tree balance is important. Currently, a multitude of at least
    30 (im)balance indices can be found in the literature, alongside numerous other tree shape statistics.
    This diversity prompts essential questions: how can we assist researchers in choosing only a small
    number of indices to mitigate the challenges of multiple testing? Is there a preeminent balance index
    tailored to specific tasks? This research expands previous studies on the examination of index power,
    encompassing almost all established indices and a broader array of alternative models, such as a
    variety of trait-based models. Our investigation reveals distinct groups of balance indices better suited
    for different tree models, suggesting that decisions on balance index selection can be enhanced with
    prior knowledge. Furthermore, we present the R software package poweRbal which allows the
    inclusion of new indices and models, thus facilitating future research on the power of tree shape
    statistics.
  bib: |
    @article{Kersting2025,
    title = {Tree balance in phylogenetic models},
    volume = {380},
    DOI = {10.1098/rstb.2023.0303},
    number = {1919},
    journal = {Philosophical Transactions of the Royal Society B: Biological Sciences},
    publisher = {The Royal Society},
    author = {Kersting, Sophie J. and Wicke, Kristina and Fischer, Mareike},
    year = {2025}
    }
  


- title: "Decks of rooted binary trees"
  authors: "Ann Clifton, Éva Czabarka, Audace Dossou-Olory, Kevin Liu, Sarah Loeb, Utku Okur, Laszlo Székely, Kristina Wicke"
  alphabetical: true
  year: 2025
  month: 02
  date: 2025-02-01
  type: article
  journal: "European Journal of Combinatorics"
  volume: 124
  pages: "21 pages"
  journal_url: "https://doi.org/10.1016/j.ejc.2024.104076"
  arxiv: "2311.02255"
  abstract: >-
    We consider extremal problems related to decks and multidecks of rooted binary trees
    (a.k.a. rooted phylogenetic tree shapes). Here, the deck (resp. multideck) of a tree 𝑇 refers
    to the set (resp. multiset) of leaf-induced binary subtrees of 𝑇. On the one hand, we
    consider the reconstruction of trees from their (multi)decks. We give lower and upper
    bounds on the minimum (multi)deck size required to uniquely encode a rooted binary
    tree on 𝑛 leaves. On the other hand, we consider problems related to deck cardinalities.
    In particular, we characterize trees with minimum-size as well as maximum-size decks.
    Finally, we present some exhaustive computations for 𝑘-universal trees, i.e., rooted
    binary trees that contain all 𝑘-leaf rooted binary trees as leaf-induced subtrees.
