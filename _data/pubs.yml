- title: "Enumerating monophyletic characters in mathematical phylogenetics"
  authors: "Mareike Fischer, Michael Hendriksen, Kristina Wicke"
  year: 2026
  date: 2026-07-24
  type: preprint
  arxiv: "2607.22097"
  journal: ""
  alphabetical: true
  abstract: >-
    Grouping species according to their phylogenetic relationships often results
    in different groups than grouping them according to their shared traits.
    Monophyletic groups play an important role in this regard, as they are groups
    of species sharing the same trait and being uniquely defined by a joint
    phylogenetic subtree. This immediately leads to the question of how to identify
    possible monophyletic groups in characters, which assign each present-day species
    a certain trait and which are typically used for phylogenetic tree reconstruction.
