- title: "Distinguishing phylogenetic level-2 networks with quartets and inter-taxon quartet distances"
  authors: "Niels Holtgrefe, Elizabeth S. Allman, Hector Baños, Leo van Iersel, Vincent Moulton, John A. Rhodes, Kristina Wicke"
  year: 2025
  month: 12
  date: 2025-12-02
  type: article
  journal: "Bulletin of Mathematical Biology"
  volume: 81
  issue: 12
  pages: "35 pages"
  journal_url: "https://doi.org/10.1007/s11538-025-01549-4"
  arxiv: "2507.17308"
  abstract: >-
    The inference of phylogenetic networks, which model complex evolutionary processes
    including hybridization and gene flow, remains a central challenge in evolutionary biology.
    Until now, statistically consistent inference methods have been limited to phylogenetic
    level-1 networks, which allow no interdependence between reticulate events. In this work,
    we establish the theoretical foundations for a statistically consistent inference method for
    a much broader class: semi-directed level-2 networks that are outer-labeled planar and
    galled. We precisely characterize the features of these networks that are distinguishable
    from the topologies of their displayed quartet trees. Moreover, we prove that an inter-
    taxon distance derived from these quartets is circular decomposable, enabling future
    robust inference of these networks from quartet data, such as concordance factors
    obtained from gene tree distributions under the Network Multispecies Coalescent model.
    Our results also have novel identifiability implications across different data types and
    evolutionary models, applying to any setting in which displayed quartets can be
    distinguished.
  bib: |
    @article{Holtgrefe2025,
    title = {Distinguishing Phylogenetic Level-2 Networks with Quartets and Inter-Taxon Quartet Distances},
    volume = {87},
    DOI = {10.1007/s11538-025-01549-4},
    number = {12},
    journal = {Bulletin of Mathematical Biology},
    publisher = {Springer Science and Business Media LLC},
    author = {Holtgrefe, Niels and Allman, Elizabeth S. and Baños, Hector and van Iersel, Leo and Moulton, Vincent and Rhodes, John A. and Wicke, Kristina},
    year = {2025}
    }


- title: "NANUQ+: A divide-and-conquer approach to network estimation"
  authors: "Elizabeth S. Allman, Hector Baños, John A. Rhodes, Kristina Wicke"
  alphabetical: true
  year: 2025
  month: 12
  date: 2025-12-01
  type: article
  journal: "Algorithms for Molecular Biology"
  volume: 20
  issue: 1
  pages: "25 pages"
  journal_url: "https://doi.org/10.1186/s13015-025-00274-w"
  biorxiv:
  abstract: >-
    Inference of a species network from genomic data remains a difficult problem, with recent
    progress mostly limited to the level-1 case. However, inference of the Tree of Blobs of a
    network, showing only the network’s cut edges, can be performed for any network by
    TINNiK, suggesting a divide-and-conquer approach to network inference where the tree’s
    multifurcations are individually resolved to give more detailed structure. Here we develop a
    method, NANUQ^+, to quickly perform such a level-1 resolution. Viewed as part of the
    NANUQ pipeline for fast level-1 inference, this gives tools for both understanding when the
    level-1 assumption is likely to be met and for exploring all highly-supported resolutions to
    cycles.
  bib: |
    @article{Allman2025,
    title = {NANUQ+: A divide-and-conquer approach to network estimation},
