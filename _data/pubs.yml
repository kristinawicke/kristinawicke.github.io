- title: "Combinatorial perspectives on Dollo-k characters in phylogenetics"
  authors: "Remco Bouckaert, Mareike Fischer, Kristina Wicke"
  year: 2021
  month: 10
  date: 2021-10-01
  type: article
  journal: "Advances in Applied Mathematics"
  volume: 131
  pages: "39 pages"
  journal_url: "https://doi.org/10.1016/j.aam.2021.102252"
  arxiv: "2011.13479"
  alphabetical: true
  abstract: >-
    Recently, the perfect phylogeny model with persistent characters has attracted great
    attention in the literature. It is based on the assumption that complex traits or characters
    can only be gained once and lost once in the course of evolution. Here, we consider a
    generalization of this model, namely Dollo parsimony, that allows for multiple character
    losses. More precisely, we take a combinatorial perspective on the notion of Dollo-k
    characters, i.e. traits that are gained at most once and lost precisely k times throughout
    evolution. We first introduce an algorithm based on the notion of spanning subtrees for
    finding a Dollo-k labelling for a given character and a given tree in linear time. We then
    compare persistent characters (consisting of the union of Dollo-0 and Dollo-1 characters)
    and general Dollo-k characters. While it is known that there is a strong connection between
    Fitch parsimony and persistent characters, we show that Dollo parsimony and Fitch
    parsimony are in general very different. Moreover, while it is known that there is a direct
    relationship between the number of persistent characters and the Sackin index of a tree,
    a popular index of tree balance, we show that this relationship does not generalize to Dollo-k
    characters. In fact, determining the number of Dollo-k characters for a given tree is much
    more involved than counting persistent characters, and we end this manuscript by
    introducing a recursive approach for the former. This approach leads to a polynomial time
    algorithm for counting the number of Dollo-k characters, and both this algorithm as well as
    the algorithm for computing Dollo-k labellings are publicly available in the Babel package
    for BEAST 2.
  bib: |
    @article{Bouckaert2021,
    title = {Combinatorial perspectives on Dollo-k characters in phylogenetics},
    volume = {131},
    DOI = {10.1016/j.aam.2021.102252},
    journal = {Advances in Applied Mathematics},
    author = {Bouckaert, Remco and Fischer, Mareike and Wicke, Kristina},
    year = {2021},
    pages = {102252}
    }
  

- title: "Unrooted non-binary tree-based phylogenetic networks"
  authors: "Mareike Fischer, Michelle Galla, Lina Herbst, Yangjing Long, Kristina Wicke"
  alphabetical: true
  year: 2021
  month: 5
  date: 2021-05-21
  type: article
  journal: "Discrete Applied Mathematics"
  volume: 294
  pages: "10-30"
  journal_url: "https://doi.org/10.1016/j.dam.2021.01.005"
  arxiv: "1810.06853"
  abstract: >-
    Phylogenetic networks are a generalization of phylogenetic trees allowing for the
    representation of non-treelike evolutionary events such as hybridization. Typically, such
    networks have been analyzed based on their ‘level’, i.e. based on the complexity of their
    2-edge-connected components. However, recently the question of how ‘treelike’ a
    phylogenetic network is has become the center of attention in various studies. This led to
    the introduction of tree-based networks, i.e. networks that can be constructed from a
    phylogenetic tree, called the base tree, by adding additional edges. While the concept of
    tree-basedness was originally introduced for rooted phylogenetic networks, it has recently
    also been considered for unrooted networks. In the present study, we compare and contrast
    findings obtained for unrooted binary tree-based networks to unrooted non-binary networks.
    In particular, while it is known that up to level 4 all unrooted binary networks are
    tree-based, we show that in the case of non-binary networks, this result only holds up to
    level 3.
  bib: |
    @article{Fischer2021,
    title = {Unrooted non-binary tree-based phylogenetic networks},
    volume = {294},
    DOI = {10.1016/j.dam.2021.01.005},
    journal = {Discrete Applied Mathematics},
    author = {Fischer, Mareike and Galla, Michelle and Herbst, Lina and Long, Yangjing and Wicke, Kristina},
    year = {2021},
    pages = {10–30}
    }

- title: "Formal links between feature diversity and phylogenetic diversity"
  authors: "Kristina Wicke, Arne Mooers, Mike Steel"
  year: 2021
  month: 5
  date: 2021-05-01
  type: article
  journal: "Systematic Biology"
  volume: 70
  issue: 3
  pages: "480–490"
  journal_url: "https://doi.org/10.1093/sysbio/syaa062"
  abstract: >-
    The extent to which phylogenetic diversity (PD) captures feature diversity (FD) is a
    topical and controversial question in biodiversity conservation. In this short
    paper, we formalize this question and establish a precise mathematical condition
    for FD (based on discrete characters) to coincide with PD. In this way, we make
    explicit the two main reasons why the two diversity measures might disagree for
    given data; namely, the presence of certain patterns of feature evolution and loss,
    and using temporal branch lengths for PD in settings that may not be appropriate
    (e.g., due to rapid evolution of certain features over short periods of time). Our
    article also explores the relationship between the “Fair Proportion” index of PD
    and a simple index of FD (both of which correspond to Shapley values in
    cooperative game theory). In a second mathematical result, we show that the two
    indices can take identical values for any phylogenetic tree, provided the branch
    lengths in the tree are chosen appropriately.
  bib: |
    @article{Wicke2021,
      title = {Formal links between feature diversity and phylogenetic diversity},
      volume = {70},
      DOI = {10.1093/sysbio/syaa062},
      number = {3},
      journal = {Systematic Biology},
      author = {Wicke, Kristina and Mooers, Arne and Steel, Mike},
      year = {2021},
      pages = {480–490}
      }

- title: "Combinatorial views on persistent characters in phylogenetics"
  authors: "Kristina Wicke, Mareike Fischer"
  year: 2020
  month: 8
  date: 2020-08-01
  type: article
  journal: "Advances in Applied Mathematics"
  volume: 119
  pages: "43 pages"
  journal_url: "https://doi.org/10.1016/j.aam.2020.102046"
  arxiv: "1802.02520"
  abstract: >-
    The so-called binary perfect phylogeny with persistent characters has recently been
    thoroughly studied in computational biology as it is less restrictive than the well-known
    binary perfect phylogeny. Here, we focus on the notion of (binary) persistent characters, i.e.
    characters that can be realized on a phylogenetic tree by at most one 0→1 transition
    followed by at most one 1→0 transition in the tree, and analyze these characters under
    different aspects. First, we illustrate the connection between persistent characters and
    Maximum Parsimony, where we characterize persistent characters in terms of the first
    phase of the famous Fitch algorithm. Afterwards we focus on the number of persistent
    characters for a given phylogenetic tree. We show that this number solely depends on the
    balance of the tree. To be precise, we develop a formula for counting the number of
    persistent characters for a given phylogenetic tree based on an index of tree balance,
    namely the Sackin index. Lastly, we consider the question of how many (carefully chosen)
    binary characters together with their persistence status are needed to uniquely determine
    a phylogenetic tree and provide an upper bound for the number of characters needed.
  bib: |
    @article{Wicke2020,
      title = {Combinatorial views on persistent characters in phylogenetics},
      volume = {119},
      DOI = {10.1016/j.aam.2020.102046},
      journal = {Advances in Applied Mathematics},
      author = {Wicke, Kristina and Fischer, Mareike},
      year = {2020},
      pages = {102046}
      }


- title: On the minimum value of the Colless index and the bifurcating trees that achieve it
  authors: "Tomás Coronado, Mareike Fischer, Lina Herbst, Francesc Rosselló, Kristina Wicke"
  alphabetical: true
  year: 2020
  month: 6
  date: 2020-06-01
  type: article
  journal: Journal of Mathematical Biology
  volume: 80
  issue: 7
  pages: "1993–2054"
  journal_url: "https://doi.org/10.1007/s00285-020-01488-9"
  arxiv: "1907.05064"
  abstract: >-
    Measures of tree balance play an important role in the analysis of phylogenetic trees. One
    of the oldest and most popular indices in this regard is the Colless index for rooted
    bifurcating trees, introduced by Colless (Syst Zool 31:100–104, 1982). While many of its
    statistical properties under different probabilistic models for phylogenetic trees have
    already been established, little is known about its minimum value and the trees that
    achieve it. In this manuscript, we fill this gap in the literature. To begin with, we derive
    both recursive and closed expressions for the minimum Colless index of a tree with n
    leaves. Surprisingly, these expressions show a connection between the minimum Colless
    index and the so-called Blancmange curve, a fractal curve. We then fully characterize the
    tree shapes that achieve this minimum value and we introduce both an algorithm to
    generate them and a recurrence to count them. After focusing on two extremal classes of
    trees with minimum Colless index (the maximally balanced trees and the greedy from the
    bottom trees), we conclude by showing that all trees with minimum Colless index also
    have minimum Sackin index, another popular balance index. 
  bib: |
    @article{Coronado2020,
    title = {On the minimum value of the Colless index and the bifurcating trees that achieve it},
    volume = {80},
    DOI = {10.1007/s00285-020-01488-9},
    number = {7},
    publisher = {Springer Science and Business Media LLC},
    author = {Coronado, Tomás M. and Fischer, Mareike and Herbst, Lina and Rosselló, Francesc and Wicke, Kristina},
    year = {2020},
    pages = {1993–2054}
    }
    

- title: Classes of tree-based networks
  authors: "Mareike Fischer, Michelle Galla, Lina Herbst, Yangjing Long, Kristina Wicke"
  alphabetical: true
  year: 2020
  month: 5
  date: 2020-05-01
  type: article
  journal: Visual Computing for Industry, Biomedicine, and Art
  volume: 3
  pages: "26 pages"
  journal_url: "https://doi.org/10.1186/s42492-020-00043-z"
  arxiv: "1810.06844"
  abstract: >-
    Recently, so-called tree-based phylogenetic networks have attracted considerable attention.
    These networks can be constructed from a phylogenetic tree, called the base tree, by adding
    additional edges. The primary aim of this study is to provide sufficient criteria for 
    tree-basedness by reducing phylogenetic networks to related graph structures. Even though it
    is generally known that determining whether a network is tree-based is an NP-complete problem,
    one of these criteria, namely edge-basedness, can be verified in linear time. Surprisingly, 
    the class of edge-based networks is closely related to a well-known family of graphs, namely,
    the class of generalized series-parallel graphs, and we explore this relationship in full detail.
    Additionally, we introduce further classes of tree-based networks and analyze their relationships.
